services:
  proalgotrader_core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: proalgotrader_core
    command: ["uv", "run", "main.py", "--environment", "${ENVIRONMENT:-development}"]
    volumes:
      - ./project:/app/project
      - ./main.py:/app/main.py
    networks:
      - proalgotrader_core_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
networks:
  proalgotrader_core_network:
    driver: bridge
